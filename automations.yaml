- alias: Flash Red
  trigger:
  - platform: state
    entity_id: input_boolean.flash_red
    to: 'on'
  action:
  - repeat:
      while:
      - condition: state
        entity_id: input_boolean.flash_red
        state: 'on'
      sequence:
      - service: light.turn_on
        data:
          entity_id:
          - light.kantoor_plafond
          - light.convectorput
          rgb_color:
          - 255
          - 38
          - 0
      - delay:
          milliseconds: 500
      - service: light.turn_off
        data:
          entity_id:
          - light.kantoor_plafond
          - light.convectorput
      - delay:
          milliseconds: 500
  id: bc98764800ce4ee5887d72d55f956c49
