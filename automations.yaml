- id: '1729727657788'
  alias: 'Test: PS5 automation'
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - sensor.ps5_668_activity
    attribute: activity
  - trigger: state
    entity_id:
    - input_boolean.tv_mode
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: sensor.ps5_668_activity
      attribute: activity
      state: playing
    - condition: state
      entity_id: input_boolean.tv_mode
      state: 'on'
  - condition: and
    conditions:
    - condition: template
      value_template: '{{ states(''sensor.time'') >= states(''input_datetime.start_tvmodus'')[0:5]
        and states(''sensor.time'') < ''24:00'' }}'
    - condition: template
      value_template: '{{ states(''sensor.time'') >= ''00:00'' and states(''sensor.time'')
        <= states(''input_datetime.end_tvmodus'')[0:5] }}'
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.tv_mode
        state: 'on'
      - condition: state
        entity_id: sensor.ps5_668_activity
        attribute: activity
        state: playing
      sequence:
      - action: switch.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: switch.adaptive_lighting_adapt_brightness_living_room
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: input_boolean.tv_mode
          state: 'off'
        - condition: not
          conditions:
          - condition: state
            entity_id: sensor.ps5_668_activity
            attribute: activity
            state: playing
      sequence:
      - action: switch.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: switch.adaptive_lighting_sleep_mode_living_room
  mode: single
