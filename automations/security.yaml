#
# Alarmstanden (input_select.alarm_mode):
#   Uit       geen meldingen
#   Nacht     kritieke melding als een buitendeur opengaat
#   Volledig  kritieke melding bij buitendeuren én bewegingssensoren
#
# De stand wisselt automatisch (slaapmodus, iedereen weg/thuis),
# maar kan altijd handmatig worden aangepast via het dashboard.

# ---------------------------------------------------------------------------
# Alarmstand automatisch wisselen
# ---------------------------------------------------------------------------
- id: security_alarm_mode_auto
  alias: "Security: alarmstand automatisch wisselen"
  description: >
    Slaapmodus aan → Nacht (alleen als het alarm uit stond).
    Slaapmodus uit → Uit (alleen als het op Nacht stond).
    Iedereen 2 minuten weg → Volledig (niet in gastenmodus).
    Iemand thuis → Uit, of Nacht als de slaapmodus aan staat.
  mode: queued
  triggers:
    - trigger: state
      entity_id: input_boolean.sleep_mode
      from: "off"
      to: "on"
      id: slapen
    - trigger: state
      entity_id: input_boolean.sleep_mode
      from: "on"
      to: "off"
      id: wakker
    - trigger: state
      entity_id: group.persons
      to: "not_home"
      not_from: ["unknown", "unavailable"]
      for: "00:02:00"
      id: weg
    - trigger: state
      entity_id: group.persons
      to: "home"
      not_from: ["unknown", "unavailable"]
      id: thuis
  actions:
    - choose:
        # Gaan slapen: alleen van Uit naar Nacht, nooit Volledig verlagen
        - conditions:
            - condition: trigger
              id: slapen
            - condition: state
              entity_id: input_select.alarm_mode
              state: "Uit"
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.alarm_mode
              data:
                option: "Nacht"

        # Wakker: alleen Nacht uitzetten, een handmatig Volledig blijft staan
        - conditions:
            - condition: trigger
              id: wakker
            - condition: state
              entity_id: input_select.alarm_mode
              state: "Nacht"
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.alarm_mode
              data:
                option: "Uit"

        # Iedereen weg (en geen gasten in huis)
        - conditions:
            - condition: trigger
              id: weg
            - condition: state
              entity_id: input_boolean.guest_mode
              state: "off"
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.alarm_mode
              data:
                option: "Volledig"

        # Iemand komt thuis
        - conditions:
            - condition: trigger
              id: thuis
            - condition: state
              entity_id: input_select.alarm_mode
              state: "Volledig"
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.alarm_mode
              data:
                option: "{{ 'Nacht' if is_state('input_boolean.sleep_mode', 'on') else 'Uit' }}"

# ---------------------------------------------------------------------------
# Melding bij deur of beweging, afhankelijk van de alarmstand
# ---------------------------------------------------------------------------
- id: security_alarm_alert
  alias: "Security: alarmmelding (Nacht: deuren, Volledig: deuren + beweging)"
  mode: parallel
  max: 10
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.gang_voordeur_deur
        - binary_sensor.keuken_achterdeur_deur
      from: "off"
      to: "on"
      id: deur
    - trigger: state
      entity_id:
        - binary_sensor.gang_sensor_motion
        - binary_sensor.keuken_sensor_motion
        - binary_sensor.slaapkamer_sensor_motion
        - binary_sensor.inloopkast_sensor_motion
      from: "off"
      to: "on"
      id: beweging
  conditions:
    - condition: or
      conditions:
        # Deuren: in Nacht én Volledig
        - condition: and
          conditions:
            - condition: trigger
              id: deur
            - condition: state
              entity_id: input_select.alarm_mode
              state: ["Nacht", "Volledig"]
        # Beweging: alleen in Volledig
        - condition: and
          conditions:
            - condition: trigger
              id: beweging
            - condition: state
              entity_id: input_select.alarm_mode
              state: "Volledig"
  actions:
    - variables:
        sensor_naam: "{{ trigger.to_state.name }}"
        kamer: "{{ area_name(trigger.entity_id) or 'onbekende ruimte' }}"
        stand: "{{ states('input_select.alarm_mode') }}"
    - action: notify.willem
      data:
        title: "Alarm ({{ stand }}) 🚨 {{ kamer }}"
        message: >
          {% if trigger.id == 'deur' %}{{ sensor_naam }} is geopend{% else %}Beweging gedetecteerd door {{ sensor_naam }}{% endif %}
          ({{ kamer }}).
        data:
          tag: "security-{{ trigger.entity_id }}"
          push:
            sound:
              name: "default"
              critical: 1
              volume: 1.0
          actions:
            - action: SOUND_ALARM
              title: Sound alarm
              activationMode: background
              authenticationRequired: true
              destructive: true
    - wait_for_trigger:
        - trigger: event
          event_type: mobile_app_notification_action
          event_data:
            action: SOUND_ALARM
      timeout: "01:00:00"
      continue_on_timeout: false
    - action: light.turn_on
      target:
        entity_id: all
      data:
        flash: long
        color_name: red

# ---------------------------------------------------------------------------
# Deur te lang open (altijd, los van de alarmstand)
# ---------------------------------------------------------------------------

- alias: "Security: front door has been open for more than 5 minutes"
  triggers:
    - trigger: state
      entity_id: binary_sensor.gang_voordeur_deur
      from: "off"
      to: "on"
      for: "00:05:00"
  actions:
    - action: notify.all_iphones
      data:
        title: "Security"
        message: "The front door has been open for more than 5 minutes."
        data:
          push:
            sound:
              name: default
              critical: 1
              volume: 0.5

- alias: "Security: back door has been open for more than 5 minutes"
  triggers:
    - trigger: state
      entity_id: binary_sensor.keuken_achterdeur_deur
      from: "off"
      to: "on"
      for: "00:05:00"
  actions:
    - action: notify.all_iphones
      data:
        title: "Security"
        message: "The back door has been open for more than 5 minutes."
        data:
          push:
            sound:
              name: default
              critical: 1
              volume: 0.5
