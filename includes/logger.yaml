default: warning
logs:
  # Bekende ruis: "custom integration has not been tested" bij elke start
  homeassistant.loader: error
  # OVapi geeft regelmatig update-fouten; niet kritiek
  custom_components.ovapi: critical

# Tijdelijk debuggen? Niet hier aanzetten, maar via:
#   Instellingen › Apparaten & diensten › [integratie] › ⋮ › Debug-logboek inschakelen
# of de actie logger.set_level (geldt tot de volgende herstart)