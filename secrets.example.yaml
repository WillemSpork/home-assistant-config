# Voorbeeld van secrets.yaml
#
# Home Assistant leest geheime waarden uit secrets.yaml. In de configuratie
# verwijs je ernaar met !secret, bijvoorbeeld:
#   latitude: !secret latitude_home
#
# Kopieer dit bestand naar secrets.yaml en vul je eigen waarden in.
# secrets.yaml staat in .gitignore en komt dus nooit in Git terecht.

# PASSWORDS
# Wifi home
wifi_password: abc123456789

# LOCATIONS
# home
latitude_home: 52.0000000
longitude_home: 5.0000000

# Schiedam
latitude_schiedam: 51.0000000
longitude_schiedam: 4.0000000

# Purmerend
latitude_purmerend: 52.0000000
longitude_purmerend: 4.0000000

# Kreta
latitude_crete: 35.0000000
longitude_crete: 24.0000000

# IP ADRRESSES

logger: debug

# ESP
esp_bedroom_url: http://192.168.1.2
esp_office_url: http://192.168.1.3

# DYSON
dyson_ip: 192.168.1.4
dyson_id: NN2-EU-1234567
dyson_password: abc123456789
dyson_username: example@hoemassistant.com