title: "Klimaat"
path: climate
icon: "mdi:home-thermometer"
cards:
  - type: horizontal-stack
    cards:
      - type: "custom:button-card"
        template: chip_back
        variables:
          ulm_chip_back_path: /ui-lovelace-minimalist/home

  - type: vertical-stack
    cards:
      - type: "custom:button-card"
        template: card_title
        name: Buiten (48 uur)

      - type: horizontal-stack
        cards:
          - type: "custom:button-card"
            template: card_graph
            entity: sensor.buiten_temperatuur
            variables:
              ulm_card_graph_color: "var(--google-red)"
              ulm_card_graph_name: Utrecht
              ulm_card_graph_entity: sensor.buiten_temperatuur
              ulm_card_graph_type: fill
              ulm_card_graph_hours: 48
              ulm_card_graph_group_by: interval
              ulm_card_graph_line_width: 5
              ulm_card_graph_points: 4
          - type: "custom:button-card"
            template: card_graph
            entity: sensor.buiten_luchtvochtigheid
            variables:
              ulm_card_graph_color: "var(--google-blue)"
              ulm_card_graph_name: Utrecht
              ulm_card_graph_entity: sensor.buiten_luchtvochtigheid
              ulm_card_graph_type: fill
              ulm_card_graph_hours: 48
              ulm_card_graph_group_by: interval
              ulm_card_graph_line_width: 5
              ulm_card_graph_points: 4

      - type: "custom:button-card"
        template: card_title
        name: Temperatuur (48 uur)

      - type: horizontal-stack
